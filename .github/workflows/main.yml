name: FTP Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          composer install --no-dev --optimize-autoloader
          npm install
          npm run prod
          php artisan storage:link

      - name: Debug local files
        run: ls -lR

      # 🔴 First FTP Deployment
      - name: Deploy to First FTP Location
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: / # Change this if needed
          exclude: |
            .DS_Store
            .git/**
            node_modules/**
            storage/**
            .github/**
            *.env
            .htaccess
            *.log
            vendor/bin/*
          passive: true  # Enable passive mode
          dry-run: false

      # 🕒 Add a short delay to avoid connection issues
      - name: Wait for 10 seconds
        run: sleep 10

      # 🟢 Second FTP Deployment
      - name: Deploy to Second FTP Location
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME_2 }}
          password: ${{ secrets.FTP_PASSWORD_2 }}
          local-dir: ./
          server-dir: / # Change this if needed
          exclude: |
            .DS_Store
            .git/**
            node_modules/**
            storage/**
            .github/**
            *.env
            .htaccess
            *.log
            vendor/bin/*
          passive: true  # Enable passive mode
          dry-run: false
