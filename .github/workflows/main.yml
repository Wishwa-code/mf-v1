            server: ${{ secrets.FTP_HOST_2 }}
            username: ${{ secrets.FTP_USERNAME_2 }}
            password: ${{ secrets.FTP_PASSWORD_2 }}
            protocol: ftps  # Or ftp if that's what's working for you
            local-dir: ./
            server-dir: /
            dry-run: false
            timeout: 900000
            exclude: |
              .git**
              node_modules/**
              storage/**
              .env*
              vendor/**              # ⛔️ Exclude vendor folder
