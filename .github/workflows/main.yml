name: FTP Deployment

on:
  push:
    branches:
      - main
      - rightwaycredit50

jobs:
  deploy-client1:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install Dependencies
        run: |
          composer install --no-dev --optimize-autoloader
          npm install
          npm run prod
          php artisan storage:link

      - name: FTP Deploy to Server 1 (Client1)
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: /
          dry-run: false
          exclude: |
            .git**
            node_modules/**
            storage/**
            .env*
            vendor/bin/*
            .github/**

  deploy-client2:
    if: github.ref == 'refs/heads/rightwaycredit50'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install Dependencies
        run: |
          composer install --no-dev --optimize-autoloader
          npm install
          npm run prod
          php artisan storage:link

      - name: Debug Environment and Files
        run: |
          echo "🔍 Debug Info:"
          echo "HOST: ${{ secrets.FTP_HOST_2 }}"
          echo "USERNAME: ${{ secrets.FTP_USERNAME_2 }}"
          echo "Files in deployment directory:"
          ls -lah

      - name: FTP Deploy to Server 2 (Client2)
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST_2 }}
          username: ${{ secrets.FTP_USERNAME_2 }}
          password: ${{ secrets.FTP_PASSWORD_2 }}
          protocol: ftps
          local-dir: ./
          server-dir: /
          dry-run: false
          exclude: |
            .git**
            node_modules/**
            storage/**
            .env*
            vendor/bin/*
            .github/**
          timeout: 900000  # 10 minutes in milliseconds 
