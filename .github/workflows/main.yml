name: FTP Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          composer install --no-dev --optimize-autoloader
          npm install
          npm run prod
          php artisan storage:link

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: public/ # Ensure the folder path ends with /
          server-dir: /path/to/remote/directory/ # Use 'server-dir' for the remote directory
          exclude: |
            node_modules/*
            .git/*
            *.env
            storage/*
          dry-run: false # Set to true for testing without deployment
