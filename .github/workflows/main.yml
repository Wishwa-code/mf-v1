name: FTP Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install Dependencies
        run: |
          composer install --no-dev --optimize-autoloader
          npm install
          npm run prod
          php artisan storage:link

      - name: FTP Deploy to Server 1
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /
          exclude: |
            .git**
            node_modules/**
            storage/**
            .env*
            vendor/bin/*
            .github/**
          dry-run: false
          cleanup: true
          ftp-passive: true
          protocol: ftp

      - name: Wait between FTP Deployments
        run: sleep 30

      - name: FTP Deploy to Server 2
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME_2 }}
          password: ${{ secrets.FTP_PASSWORD_2 }}
          local-dir: ./
          server-dir: /
          exclude: |
            .git**
            node_modules/**
            storage/**
            .env*
            vendor/bin/*
            .github/**
          dry-run: false
          cleanup: true
          ftp-passive: true
          protocol: ftp
