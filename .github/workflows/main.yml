name: FTP Deployment (main)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy-client1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install PHP Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader
          php artisan storage:link || true

      - name: FTP Deploy to Server (Client1)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server:   ${{ secrets.FTP_HOST }}        # e.g. ftp.yourdomain.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: strict
          local-dir: ./
          server-dir: /                             # change if your site lives under /public_html
          dry-run: false
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env*
            **/storage/logs/**
            **/storage/framework/**
            public/storage/**
            vendor/bin/*
            # keep public/, exclude all then include what’s needed:
            public/**
            !public/index.php
            !public/.htaccess
