name: FTP Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          composer install --no-dev --optimize-autoloader
          npm install
          npm run prod
          php artisan storage:link

      - name: Debug local files
        run: ls -lR

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./ # Deploy everything from the repository root
          server-dir: / # Adjust this path based on your server
          exclude: |
            .DS_Store
            .git/** # Ensure all Git files are excluded
            node_modules/**
            storage/**
            .github/**
            *.env
            .htaccess
            *.log
            vendor/bin/*
          dry-run: false # Set to true for testing without deployment
