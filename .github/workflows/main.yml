name: FTP Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          composer install --no-dev --optimize-autoloader
          npm install
          npm run prod
          php artisan storage:link

      - name: Deploy to FTP
        uses: microsoft/ftp-action@v1
        with:
            host: ${{ secrets.FTP_HOST }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            local-dir: ./ # Deploy everything from the repository root
            server-dir: /public_html/ # Adjust this path based on your server
            exclude: |
              .git/*
              .github/*
              .DS_Store
              node_modules/*
              storage/logs/*
              *.env  
            dry-run: false # Set to true for testing without deployment
