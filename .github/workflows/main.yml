name: FTP Deployment

on:
  push:
    branches:
      - main
      - rightwaycredit50
      - greenlankacapital
      - greenlankatrustdo
      - northerncredit
      - noble
      - finwin
      - minvence
      - DandD
      - futurehopeinvestment
      - sirikathaholdings

jobs:
  deploy-client1:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader
          npm ci
          npm run prod
          php artisan storage:link
          ls -la public/build || true

      - name: FTP Deploy to Server 1 (Client1)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}     # must be a resolvable hostname
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: strict
          local-dir: ./
          server-dir: /                       # or your site root (e.g. /public_html)
          dry-run: false
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env*
            **/storage/logs/**
            **/storage/framework/**
            public/storage/**
            vendor/bin/*
            # keep public/, but exclude everything then re-include what you need:
            public/**
            !public/build/**
            !public/index.php
            !public/.htaccess
  

  deploy-client2:
      if: github.ref == 'refs/heads/rightwaycredit50'
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v2
  
        - name: Setup PHP
          uses: shivammathur/setup-php@v2
          with:
            php-version: 8.2
  
        - name: Install Dependencies
          run: |
            composer install --no-dev --optimize-autoloader
            npm install
            npm run prod
            php artisan storage:link
  
        - name: FTP Deploy to Server 2 (Client2)
          uses: SamKirkland/FTP-Deploy-Action@4.3.0
          with:
            server: ${{ secrets.FTP_HOST_2 }}
            username: ${{ secrets.FTP_USERNAME_2 }}
            password: ${{ secrets.FTP_PASSWORD_2 }}
            protocol: ftps  # Or ftp if that's what's working for you
            local-dir: ./
            server-dir: /
            dry-run: false
            timeout: 900000
            exclude: |
              .git**
              node_modules/**
              storage/**
              .env*
              vendor/**              # ⛔️ Exclude vendor folder
              vendor/bin/*
              .github/**
              public/** 
              !public/JS/**
              tests/**
              

